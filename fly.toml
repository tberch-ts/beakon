# fly.toml app configuration file generated for beakon on 2026-07-10T23:16:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'beakon'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  BASE_URL = 'https://beakon.fly.dev'
  DB_PATH = '/data/beakon.db'
  NODE_ENV = 'production'
  PORT = '3000'
  TRIAL_DAYS = '14'

[[mounts]]
  source = 'beakon_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
